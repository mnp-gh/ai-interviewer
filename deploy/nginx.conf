# Host Nginx site for the Docker deployment: copy to /etc/nginx/conf.d/ai-interviewer.conf,
# replace example.com with SITE_ADDRESS, then run certbot --nginx to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Resume PDFs are up to 4 MB.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite whatever the browser sent: the server counts per-network budgets by this header.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Questions, feedback and coach replies stream as NDJSON: pass them on as they arrive.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
