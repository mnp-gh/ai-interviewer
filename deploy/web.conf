# Nginx inside the web container: serves the client and proxies /api to the server container.
# Plain HTTP: the host's Nginx (deploy/nginx.conf) terminates HTTPS in front.
# The whole nginx.conf, so it doesn't depend on the image's defaults. The image runs as non-root:
# it listens on 8080 and writes its PID and temporary files to /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_tokens off;

        # Resume PDFs are up to 4 MB.
        client_max_body_size 5m;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        # Set here only: an add_header inside a location would drop all of these for that location.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

        # Docker's DNS, re-resolved at request time so a recreated server container is found at its new address.
        resolver 127.0.0.11 valid=10s;

        location /api/ {
            set $api http://server:8080;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Pass on the X-Real-IP the host's Nginx overwrote with the client's address; the server trusts it
            # for per-network budgets (CLIENT_IP_HEADER), so this container is published on localhost only.
            proxy_set_header X-Real-IP $http_x_real_ip;
            # Questions, feedback and coach replies stream as NDJSON: pass them on as they arrive.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Hashed build assets never change; everything else (index.html) is revalidated.
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
        }
    }
}
