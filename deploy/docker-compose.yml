# Self-hosted deployment behind a Cloudflare Tunnel, which terminates HTTPS and forwards to
# 127.0.0.1:8081. CI (.github/workflows/deploy.yml) builds the images and runs
# `docker compose pull && docker compose up -d` on the server; `docker compose up -d --build` in this
# folder builds locally (after `docker login dhi.io`, for the base images).
# Needs a .env next to this file with SITE_ADDRESS (and optionally VITE_TURNSTILE_SITE_KEY; see .env.example),
# and ../server/.env with the server's variables (see server/.env.example).
# Fixed name, so this app's containers and network never mix with another project's on the same server.
name: ai-interviewer

services:
  server:
    container_name: ai-interviewer-server
    image: ${IMAGE_REPO:-ai-interviewer}/server:${IMAGE_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    restart: unless-stopped
    init: true
    # Caps keep one app from starving others sharing the server.
    mem_limit: 1g
    cpus: 0.4
    env_file: ../server/.env
    environment:
      PUBLIC_ORIGIN: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      CLIENT_IP_HEADER: cf-connecting-ip
      NEW_RELIC_APP_NAME: ai-interviewer-api
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
    # No published ports: only the web container can reach the API.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s
    networks:
      - default

  web:
    image: ${IMAGE_REPO:-ai-interviewer}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: ai-interviewer-web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      server:
        condition: service_healthy
    # Retained for zero-downtime transition; remove once Cloudflare Tunnel points to ai-interviewer-web:8080
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - default
      - web-gateway

networks:
  default:
  web-gateway:
    name: web-gateway
    external: true
