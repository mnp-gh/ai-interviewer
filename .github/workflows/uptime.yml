# Checks every 30 minutes that the live site's API answers its health check. A failed scheduled run
# emails the repository owner. GitHub may delay scheduled runs, and pauses them after 60 days without
# repository activity.
name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        env:
          URL: https://ai-interviewer.mnplabs.uk/api/health
        # Five tries over about two minutes, so a deploy's restart or a network blip isn't an outage.
        run: |
          for i in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 15 "$URL") && [ "$(jq -r .ok <<<"$body")" = true ]; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Attempt $i failed${body:+: $body}"
            [ "$i" = 5 ] || sleep 20
          done
          echo "::error::$URL is unhealthy"
          exit 1
